apiVersion: batch/v1
kind: CronJob
metadata:
  name: minishop-worker-cronjob
  namespace: minishop-dev
spec:
  # Schedule: Run every 2 minutes (ideal for verifying in dev)
  schedule: "*/2 * * * *"
  
  # Prevent new jobs from starting if the previous one is still running
  concurrencyPolicy: Forbid

  # Keep history of finished job pods for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      # Automatically clean up completed job pods after 300 seconds
      ttlSecondsAfterFinished: 300
      backoffLimit: 2

      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: worker
              image: worker:latest # Built from worker/Dockerfile
              imagePullPolicy: IfNotPresent
              
              # Pass DB credentials so worker.py can connect to Postgres
              env:
                - name: DB_HOST
                  value: "postgres-service"
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_DB
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD