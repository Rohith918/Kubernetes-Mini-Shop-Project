apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ensures every resource defined below gets applied to the prod namespace
namespace: minishop-prod

resources:
  - namespace.yaml
  - postgres/configmap.yaml
  - postgres/secret.yaml
  - postgres/pvc.yaml
  - postgres/init-configmap.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - backend/configmap.yaml
  - backend/secret.yaml
  - backend/serviceaccount.yaml
  - rbac/role.yaml
  - rbac/rolebinding.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/hpa.yaml
  - frontend/configmap.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - worker/cronjob.yaml
  - jobs/db-migration-job.yaml
  - ingress/ingress.yaml
  - network-policy/restrict-db-access.yaml

# Automatically tags every resource for prod filtering/monitoring
commonLabels:
  environment: prod
  app: minishop